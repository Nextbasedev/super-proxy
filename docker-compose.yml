services:
  super-proxy:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_PATH: /data/super-proxy.sqlite
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      GATEWAY_NAME: ${GATEWAY_NAME:-Super Proxy}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - super-proxy-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  super-proxy-data:
